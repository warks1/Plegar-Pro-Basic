name: Publish Plegar Pro to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for browser verification
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies and Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium

      - name: Verify published assets and module references
        run: node scripts/verify-static-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload executable application
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test live page and critical JavaScript bundles
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          tempdir="$(mktemp -d)"
          trap 'rm -rf "$tempdir"' EXIT
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 2 "$PAGE_URL" -o "$tempdir/index.html"
          grep -q 'id="root"' "$tempdir/index.html"
          grep -q 'assets/index-BejcmiWV.js' "$tempdir/index.html"
          for asset in \
            assets/index-BejcmiWV.js \
            assets/index-kS27Z77S.css \
            assets/concept-two-v024.css \
            assets/boot-guard.js \
            assets/navigation-v024.js \
            assets/Programming2DPage-DZQa639B.js \
            assets/Programming3DPage-B-9iLBwM.js \
            assets/CollisionsPage-Dloo_dLz-fix3.js; do
            code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --retry 6 --retry-all-errors --retry-delay 2 "${PAGE_URL%/}/$asset")"
            if [ "$code" != "200" ]; then
              echo "Recurso publicado no disponible ($code): $asset"
              exit 1
            fi
          done
          echo "Prueba HTTP de GitHub Pages: OK · HTML de inicio y 8 recursos críticos responden 200."

      - name: Verify actual browser launch and engineering module navigation
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/smoke-browser.mjs "$PAGE_URL"
