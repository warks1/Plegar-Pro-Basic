name: Plegar Pro Plus - pruebas de motores
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar geometría, planos, cinemática y pruebas existentes
        run: node --test tests/*.test.cjs
