name: Static site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify published site and smoke-test server
        run: npm run build
