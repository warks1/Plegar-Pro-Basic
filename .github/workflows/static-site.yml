name: Static site and source checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build React source and recovered module routes
        run: npm run build:strict
      - name: Install Chromium for source-route browser checks
        run: npx playwright install --with-deps chromium
      - name: Smoke-test every source route in Chromium
        run: node scripts/smoke-source-routes.mjs
      - name: Verify published site and smoke-test server
        run: npm run build
