name: Validate Plegar Pro changes

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify published site and referenced assets
        run: npm run verify

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Run unit tests
        if: always()
        run: npm run test:unit

      - name: Check lint
        if: always()
        run: npm run lint
