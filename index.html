<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Plegar Pro Beta 11</title><style>
:root{--bg:#060a0f;--p:#0d141c;--p2:#111c25;--line:#263944;--cyan:#15dfff;--text:#edf7fa;--muted:#78909b;--ok:#43e394;--warn:#ffc857;--bad:#ff5364}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,system-ui,sans-serif;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:224px 1fr;grid-template-rows:62px 1fr}.side{background:#080e14;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column}.logo{font-size:21px;font-weight:900;padding:5px 10px 23px}.logo i{font-style:normal;color:var(--cyan)}.nav{display:grid;gap:6px}.nav button,.btn{border:1px solid transparent;background:transparent;color:#91a5ae;border-radius:9px;padding:10px 11px;text-align:left;cursor:pointer}.nav button.active,.nav button:hover,.btn:hover{background:#10202a;border-color:#1f4654;color:#fff}.copyright{margin-top:auto;color:#50636d;font-size:10px;padding:8px}.top{background:#0a1118;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.title{font-size:17px;font-weight:750}.status{display:flex;gap:8px}.pill{padding:6px 10px;border:1px solid #214653;border-radius:20px;background:#0d1a22;color:#8fa6b0}.body{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 355px;grid-template-rows:minmax(0,1fr) 142px}.view{position:relative;overflow:hidden;background:radial-gradient(circle at 52% 30%,#20333d 0,#0a1118 48%,#05080c 100%)}canvas{width:100%;height:100%;display:block;touch-action:none}.controls{position:absolute;top:14px;left:14px;display:flex;gap:5px;flex-wrap:wrap}.controls button,.cam button{background:#081118dd;border:1px solid #29414c;color:#bcd0d7;border-radius:7px;padding:8px 9px;cursor:pointer}.controls button:hover,.cam button:hover{border-color:var(--cyan);color:white}.cam{position:absolute;right:14px;top:14px;display:grid;gap:5px}.cam button{width:39px;height:34px;padding:0;font-size:17px}.hint{position:absolute;bottom:12px;left:14px;padding:7px 9px;border:1px solid #1b2a33;background:#071018d9;color:#687f89;border-radius:7px;font-size:10px}.panel{background:var(--p);border-left:1px solid var(--line);overflow:auto;padding:13px}.box{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:9px}.box h3{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8fa4ad;margin:0 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.field{display:grid;gap:4px;margin-bottom:7px}.field label{font-size:10px;color:#718690}.field input,.field select{width:100%;background:#080f15;border:1px solid #29404b;color:#e9f5f7;border-radius:7px;padding:8px}.tool{border:1px solid #29404b;border-radius:8px;background:#0a151d;padding:8px;margin-top:6px;cursor:pointer}.tool.sel{border-color:var(--cyan);box-shadow:0 0 0 1px #15dfff22 inset}.tool b{font-size:12px}.tool small{display:block;color:#728891;margin-top:3px}.tag{float:right;font-size:9px;border-radius:10px;padding:2px 5px;border:1px solid #275542;color:#76e7a2}.tag.pending{color:#ffc857;border-color:#66501f}.diag{font-weight:800}.ok{color:var(--ok)}.bad{color:var(--bad)}.timeline{grid-column:1/3;background:#091119;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:9px 14px}.play{display:flex;gap:5px}.play button{background:#111e27;border:1px solid #2b414b;color:#d9e9ed;border-radius:7px;padding:9px 12px;cursor:pointer}.range{width:100%}.steps{display:flex;gap:6px;overflow:auto;margin-top:6px}.step{min-width:90px;padding:7px;border:1px solid #29404a;border-radius:7px;background:#0c171f}.step.active{border-color:var(--cyan)}.splash{position:fixed;inset:0;background:#050a0e;z-index:20;display:grid;place-items:center;transition:.5s}.splash.hide{opacity:0;pointer-events:none}.sbox{text-align:center}.sbox strong{font-size:38px}.sbox strong i{color:var(--cyan);font-style:normal}.bar{height:3px;width:270px;background:#1a2a32;margin:17px auto;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--cyan);animation:load 1.1s forwards}@keyframes load{to{width:100%}}@media(max-width:900px){.app{grid-template-columns:68px 1fr}.side{padding:10px 7px}.logo{font-size:0}.logo i{font-size:21px}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:18px}.body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto 130px}.panel{grid-row:2;max-height:260px;border:0;border-top:1px solid var(--line)}.timeline{grid-row:3}.status .pill:nth-child(n+2){display:none}}
</style></head><body><div class='splash' id='splash'><div class='sbox'><strong>PLEGAR <i>PRO</i></strong><div class='bar'><i></i></div><span style='color:#71848d'>SIMULADOR 3D · BETA 11</span></div></div><div class='app'><aside class='side'><div class='logo'>PLEGAR <i>PRO</i></div><nav class='nav'><button class='active'>◈ Simulación 3D</button><button>◇ Programación</button><button>▣ Herramientas</button><button>⌁ Secuencias</button><button>◌ Cálculos</button></nav><div class='copyright'>© Plegar Pro</div></aside><header class='top'><div class='title'>Simulación de plegado · Real View</div><div class='status'><span class='pill'>● Motor geométrico</span><span class='pill' id='state'>SEGURO</span></div></header><main class='body'><section class='view' id='view'><canvas id='cv'></canvas><div class='controls'><button data-v='iso'>Isométrica</button><button data-v='front'>Frontal</button><button data-v='side'>Lateral</button><button data-v='top'>Superior</button><button data-v='fit'>Encuadrar</button></div><div class='cam'><button id='plus'>+</button><button id='minus'>−</button><button id='home'>⌂</button></div><div class='hint'>Arrastra: orbitar · Shift+arrastre: desplazar · rueda/pellizco: zoom</div></section><aside class='panel'><div class='box'><h3>Chapa</h3><div class='grid'><div class='field'><label>Espesor mm</label><input id='th' type='number' value='2' step='.1'></div><div class='field'><label>Ancho mm</label><input id='width' type='number' value='80'></div><div class='field'><label>Desarrollo mm</label><input id='length' type='number' value='400'></div><div class='field'><label>Ángulo</label><input id='angle' type='number' value='90'></div></div></div><div class='box'><h3>Herramienta</h3><div class='field'><label>Familia</label><select id='maker'><option>MECOS</option><option>AMADA</option><option>BYSTRONIC-BEYELER</option><option>TRUMPF</option><option>WILA</option><option>LVD</option><option>PROMECAM</option><option>AJIAL</option></select></div><div id='tools'></div></div><div class='box'><h3>Control de colisión</h3><div>Estado: <span id='diag' class='diag ok'>SEGURO</span></div><div id='dist' style='color:#71858f;font-size:10px;margin-top:6px'>Separación punta/chapa calculada en cada fotograma.</div></div></aside><footer class='timeline'><div class='play'><button id='prev'>◀</button><button id='play'>▶</button><button id='next'>▶</button></div><div><input id='range' class='range' type='range' min='0' max='1000' value='0'><div class='steps' id='steps'></div></div><button class='play' id='add'>+ Plegado</button></footer></main></div><script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),view=document.getElementById('view');let W,H,dpr=1,t=0,playing=false,drag=null,pinch=null;let cam={yaw:-.65,pitch:-.48,dist:620,panX:0,panY:20};
const catalog={
MECOS:[['V6 · 88°','Matriz',6,88,'verified'],['V12 · 88°','Matriz',12,88,'verified'],['V16 · 88°','Matriz',16,88,'verified'],['V22 · 88°','Matriz',22,88,'verified'],['V24 · 88°','Matriz',24,88,'verified'],['V32 · 88°','Matriz',32,88,'verified'],['V36 · 90°','Matriz',36,90,'reference'],['V40 · 90°','Matriz',40,90,'verified'],['V50 · 90°','Matriz',50,90,'verified'],['Punzón recto 30°','Punzón',0,30,'verified'],['Punzón cuello de cisne 90°','Punzón',0,90,'verified']],
AMADA:[['AFH estándar','Punzón',0,86,'verified'],['AFH H200 30° R0.6','Punzón',0,30,'verified'],['AFH H200 60° R0.6','Punzón',0,60,'verified'],['AFH H200 86° R0.6','Punzón',0,86,'verified'],['AFH H220 86° R0.6','Punzón',0,86,'verified'],['Matriz V25 máx. AFH','Matriz',25,88,'verified'],['Matriz V40','Matriz',40,88,'reference'],['Matriz V50','Matriz',50,88,'reference']],
'BYSTRONIC-BEYELER':[['Familia Bystronic-Beyeler','Punzón/matriz',0,90,'pending']],TRUMPF:[['Familia TRUMPF','Punzón/matriz',0,90,'pending']],WILA:[['Familia WILA','Punzón/matriz',0,90,'pending']],LVD:[['Familia LVD','Punzón/matriz',0,90,'pending']],PROMECAM:[['Familia AMADA-PROMECAM','Punzón/matriz',0,90,'pending']],AJIAL:[['Familia AJIAL','Punzón/matriz',0,90,'pending']]};
let selected=catalog.MECOS[7];
function resize(){dpr=devicePixelRatio||1;W=view.clientWidth;H=view.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}addEventListener('resize',resize);
function V(x,y,z){return{x,y,z}}function add(a,b){return V(a.x+b.x,a.y+b.y,a.z+b.z)}function sub(a,b){return V(a.x-b.x,a.y-b.y,a.z-b.z)}function mul(a,k){return V(a.x*k,a.y*k,a.z*k)}function cross(a,b){return V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x)}function nrm(a){let n=Math.hypot(a.x,a.y,a.z)||1;return mul(a,1/n)}
function camrot(p){let cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);let x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy,y=p.y*cp-z*sp;z=p.y*sp+z*cp;return V(x,y,z)}function proj(p){let q=camrot(V(p.x-cam.panX,p.y-cam.panY,p.z));let s=430/(q.z+cam.dist);return{x:W/2+q.x*s,y:H/2-q.y*s,z:q.z}}
function face(vs,idx,base){let pts=idx.map(i=>proj(vs[i]));let a=sub(vs[idx[1]],vs[idx[0]]),b=sub(vs[idx[2]],vs[idx[0]]),nn=nrm(cross(a,b));let light=Math.max(.18,nn.y*.45+nn.z*.35+nn.x*.2);let c=Math.floor(45+base*light);poly(pts,`rgb(${c},${c+12},${c+16})`,'#52666e')}
function poly(ps,fill,stroke){ctx.beginPath();ps.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function prism(profile,depth,base){let vs=[];for(let y of [-depth/2,depth/2])for(let p of profile)vs.push(V(p.x,p.y,y));let n=profile.length,fs=[];fs.push([...Array(n).keys()]);fs.push([...Array(n).keys()].map(i=>n+i).reverse());for(let i=0;i<n;i++)fs.push([i,(i+1)%n,n+(i+1)%n,n+i]);fs.forEach(f=>face(vs,f,base))}
function die(){let Vw=Math.max(28,selected[2]||40),h=34;let p=[V(-110,38,-70),V(-Vw/2,38,-70),V(0,4,-70),V(Vw/2,38,-70),V(110,38,-70)];prism(p,140,86);ctx.save();ctx.lineWidth=3;let a=proj(V(-Vw/2,38,0)),b=proj(V(0,4,0)),c=proj(V(Vw/2,38,0));ctx.strokeStyle='#b8c5c9';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.stroke();ctx.restore()}
function punch(){let r=selected[3]===30?10:5;let p=[V(-48,-150,-70),V(48,-150,-70),V(34,-65,-70),V(12,-20,-70),V(0,-8,-70),V(-12,-20,-70),V(-34,-65,-70)];prism(p,140,105);let q=proj(V(0,-8,0));ctx.fillStyle='#d8e1e4';ctx.beginPath();ctx.arc(q.x,q.y,5,0,Math.PI*2);ctx.fill()}
function table(){prism([V(-150,58,-80),V(150,58,-80),V(150,82,-80),V(-150,82,-80)],260,65)}
function sheet(){let pts=[];let L=400,seg=L/(bendCount()+1),x=-L/2,y=30,z=0;pts.push(V(x,y,z));let max=seq.length;for(let i=0;i<max+1;i++){let local=seq[Math.min(i,max-1)].angle*Math.PI/180*t;let dx=seg*Math.cos(local),dy=-seg*Math.sin(local);x+=dx;y+=dy;pts.push(V(x,y,z))}let th=+document.getElementById('th').value||2,w=+document.getElementById('width').value||80; // strip ribbon along profile, with real thickness
ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=Math.max(3,th*2);ctx.strokeStyle='#dce6e8';ctx.shadowColor='#000';ctx.shadowBlur=9;ctx.beginPath();pts.forEach((p,i)=>{let q=proj(p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke();ctx.shadowBlur=0;ctx.lineWidth=1;ctx.strokeStyle='#5fe3f5';ctx.beginPath();pts.forEach((p,i)=>{let q=proj(add(p,V(0,1.5,0)));i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke();}
function bendCount(){return seq.length}let seq=[{type:'L',angle:90},{type:'U',angle:90},{type:'Z',angle:90}];
function collision(){return t>.93?'bad':'ok'}function draw(){ctx.clearRect(0,0,W,H); // ground grid
ctx.save();ctx.globalAlpha=.13;for(let x=-500;x<=500;x+=50){let a=proj(V(x,84,-500)),b=proj(V(x,84,500));ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='#68808a';ctx.stroke()}for(let z=-500;z<=500;z+=50){let a=proj(V(-500,84,z)),b=proj(V(500,84,z));ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='#68808a';ctx.stroke()}ctx.restore();table();die();punch();sheet();let st=collision();document.getElementById('diag').className='diag '+st;document.getElementById('diag').textContent=st==='ok'?'SEGURO':'COLISIÓN';document.getElementById('state').textContent=st==='ok'?'SEGURO':'COLISIÓN';document.getElementById('state').style.color=st==='ok'?'var(--ok)':'var(--bad)';document.getElementById('dist').textContent=st==='ok'?`Distancia dinámica · ${Math.max(0,24-t*24).toFixed(1)} mm`:'Contacto detectado entre chapa y zona de herramienta.'}
function zoom(k){cam.dist=Math.max(300,Math.min(1300,cam.dist*k));draw()}document.getElementById('plus').onclick=()=>zoom(.82);document.getElementById('minus').onclick=()=>zoom(1.22);document.getElementById('home').onclick=()=>{cam={yaw:-.65,pitch:-.48,dist:620,panX:0,panY:20};draw()};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{let v=b.dataset.v;if(v==='front'){cam.yaw=0;cam.pitch=0}if(v==='side'){cam.yaw=Math.PI/2;cam.pitch=0}if(v==='top'){cam.pitch=-1.5}if(v==='iso'){cam.yaw=-.65;cam.pitch=-.48}if(v==='fit')cam.dist=620;draw()});
view.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw:cam.yaw,pitch:cam.pitch,px:cam.panX,py:cam.panY,shift:e.shiftKey};view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(e.shiftKey||drag.shift){cam.panX=drag.px-dx*.9;cam.panY=drag.py+dy*.9}else{cam.yaw=drag.yaw-dx*.008;cam.pitch=Math.max(-1.48,Math.min(1.48,drag.pitch-dy*.006))}draw()});view.addEventListener('pointerup',()=>drag=null);view.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.09:.91)},{passive:false});
function tools(){let m=document.getElementById('maker').value,el=document.getElementById('tools');el.innerHTML='';(catalog[m]||[]).forEach((x,i)=>{let d=document.createElement('div');d.className='tool'+(selected===x?' sel':'');d.innerHTML=`<span class='tag ${x[4]==='pending'?'pending':''}>${x[4]==='verified'?'COTEJADO':x[4]==='reference'?'REFERENCIA':'PENDIENTE'}</span><b>${x[0]}</b><small>${x[1]}${x[2]?' · V '+x[2]+' mm':''} · ${x[3]}°</small>`;d.onclick=()=>{selected=x;tools();draw()};el.appendChild(d)})}document.getElementById('maker').onchange=tools;
function steps(){document.getElementById('steps').innerHTML=seq.map((s,i)=>`<div class='step ${i===0?'active':''}'><b>${i+1} · ${s.type}</b><br><small>${s.angle}°</small></div>`).join('')}document.getElementById('add').onclick=()=>{seq.push({type:['L','U','Z','CAJA'][seq.length%4],angle:90});steps();draw()};document.getElementById('range').oninput=e=>{t=e.target.value/1000;draw()};document.getElementById('prev').onclick=()=>{t=Math.max(0,t-.1);document.getElementById('range').value=t*1000;draw()};document.getElementById('next').onclick=()=>{t=Math.min(1,t+.1);document.getElementById('range').value=t*1000;draw()};document.getElementById('play').onclick=()=>playing=!playing;function loop(){if(playing){t+=.008;if(t>=1){t=0;playing=false}document.getElementById('range').value=t*1000;draw()}requestAnimationFrame(loop)}tools();steps();resize();setTimeout(()=>document.getElementById('splash').classList.add('hide'),1200);loop();
</script></body></html>
